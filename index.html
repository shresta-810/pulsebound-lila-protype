<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulsebound — Prototype</title>
<style>
html,body{margin:0;height:100%;background:#090b12;color:#eef2ff;font-family:Inter,system-ui,sans-serif;overflow:hidden}
#wrap{height:100%;display:flex;align-items:center;justify-content:center}
canvas{background:#101522;border:1px solid #293248;box-shadow:0 20px 70px #0008;max-width:100vw;max-height:100vh}
#help{position:fixed;left:16px;top:14px;font-size:13px;color:#aeb8d2;line-height:1.5;pointer-events:none}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.panel{background:#111827ee;border:1px solid #34415e;border-radius:14px;padding:24px 28px;min-width:280px;text-align:center;box-shadow:0 18px 60px #0009}
button{font:inherit;border:0;border-radius:9px;padding:10px 16px;background:#6ee7f9;color:#061017;font-weight:800;cursor:pointer}
.choice{display:block;width:100%;margin:8px 0;text-align:left;background:#1b2436;color:#eaf1ff;border:1px solid #35435e}
.small{font-size:12px;color:#9ba8c5}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="600"></canvas></div>
<div id="help">WASD / Arrow keys to move · Auto-fire · Survive 180s · Your movement teaches the Director</div>
<div id="msg"></div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),msg=document.getElementById('msg');
const W=c.width,H=c.height,keys={}; let state='play',t=0,last=0,spawn=0,shots=0,kills=0,score=0,style='balanced';
const p={x:W/2,y:H/2,r:12,spd:190,hp:100,maxhp:100,fire:.32,damage:18,trail:[],dash:0};
let enemies=[], bullets=[], gems=[], upgrades=[], wave=1, styleScore={aggressive:0,mobile:0,collector:0};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(['1','2','3'].includes(e.key)&&state==='upgrade')choose(+e.key-1);if(e.key==='r'&&state==='dead')location.reload()});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function spawnEnemy(){
 let side=Math.floor(Math.random()*4), ex=side<2?(side?W+20:-20):Math.random()*W, ey=side<2?Math.random()*H:(side?H+20:-20);
 let roll=Math.random(), kind=roll<.14?'hunter':roll<.30?'tank':'grunt';
 let hp=kind==='tank'?70+wave*5:kind==='hunter'?30+wave*3:24+wave*2;
 enemies.push({x:ex,y:ey,r:kind==='tank'?17:kind==='hunter'?9:11,hp,max:hp,kind,speed:kind==='tank'?35:kind==='hunter'?68:48});
}
function shoot(){
 let target=enemies.reduce((a,e)=>!a||dist(p,e)<dist(p,a)?e:a,null); if(!target)return;
 let d=dist(p,target), vx=(target.x-p.x)/d,vy=(target.y-p.y)/d;
 bullets.push({x:p.x,y:p.y,vx:vx*520,vy:vy*520,r:4,damage:p.damage});
 shots++;
}
function addGem(e){gems.push({x:e.x,y:e.y,r:6,v:1})}
function inferStyle(dt,moving){
 if(moving) styleScore.mobile+=dt;
 if(shots>kills*1.6) styleScore.aggressive+=dt;
 if(gems.length<4) styleScore.collector+=dt*.4;
 let vals=Object.entries(styleScore).sort((a,b)=>b[1]-a[1]); style=vals[0][0];
}
function director(){
 // A transparent, lightweight adaptive "AI director": it classifies recent play and changes pressure.
 let base=4+Math.floor(t/20), mult=style==='mobile'?1.15:style==='aggressive'?1.05:.9;
 let n=Math.ceil(base*mult);
 for(let i=0;i<n;i++)spawnEnemy();
}
function levelUp(){
 state='upgrade'; upgrades=[
  {name:'+35% FIRE RATE',desc:'Shoot faster. More pressure, more kills.',fn:()=>p.fire*=.65},
  {name:'HARDENED CORE',desc:'+35 max HP and heal 35.',fn:()=>{p.maxhp+=35;p.hp=Math.min(p.maxhp,p.hp+35)}},
  {name:'HEAVY PULSE',desc:'+12 damage per shot.',fn:()=>p.damage+=12}
 ]; renderUpgrade();
}
function choose(i){upgrades[i].fn();wave++;state='play';msg.innerHTML='';}
function renderUpgrade(){
 msg.innerHTML='<div class="panel"><div style="font-size:20px;font-weight:800">WAVE '+wave+' — PICK ONE</div>'+
 upgrades.map((u,i)=>`<button class="choice" onclick="choose(${i})"><b>${i+1}. ${u.name}</b><br><span class="small">${u.desc}</span></button>`).join('')+
 '<div class="small">Your upgrade changes what you can do next — and your playstyle changes how the Director responds.</div></div>';
}
function gameOver(){
 state='dead';msg.innerHTML=`<div class="panel">
<div style="font-size:28px;font-weight:900">RUN OVER</div>
<p><b>${Math.floor(t)}s</b> survived · <b>${kills}</b> kills · <b>${Math.floor(score)}</b> score</p>
<p>The Director read your style as <b>${style}</b>.</p>
<p class="small">${style==='mobile'?'You moved constantly, so the arena leaned into faster pursuit.':
style==='aggressive'?'You prioritized combat, so the arena answered with more pressure.':
'You balanced movement, combat and collection, so pressure stayed controlled.'}</p>
<p style="margin-top:18px">Next run: deliberately play a different way.</p>
<button onclick="location.reload()">PLAY AGAIN</button>
<p class="small">Try to make the Director classify you differently.</p>
</div>`;
}
function update(dt){
 if(state!=='play')return;
 t+=dt; spawn-=dt;
 let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 let dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
 let moving=dx||dy; if(moving){let l=Math.hypot(dx,dy);dx/=l;dy/=l;p.x+=dx*p.spd*dt;p.y+=dy*p.spd*dt;p.trail.push({x:p.x,y:p.y,a:1});if(p.trail.length>90)p.trail.shift()}
 p.x=clamp(p.x,18,W-18);p.y=clamp(p.y,18,H-18);
 inferStyle(dt,moving);
 p.fireTimer=(p.fireTimer||0)+dt; if(p.fireTimer>=p.fire){p.fireTimer=0;shoot()}
 if(spawn<=0){director();spawn=Math.max(.55,2.0-t*.004)}
 bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});
 bullets=bullets.filter(b=>b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+20);
 enemies.forEach(e=>{
   let dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1; e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt;
   if(d<e.r+p.r){p.hp-= (e.kind==='tank'?18:8)*dt}
 });
 for(let i=bullets.length-1;i>=0;i--)for(let j=enemies.length-1;j>=0;j--)if(dist(bullets[i],enemies[j])<bullets[i].r+enemies[j].r){
   enemies[j].hp-=bullets[i].damage;bullets.splice(i,1);
   if(enemies[j].hp<=0){addGem(enemies[j]);kills++;score+=10+wave*2;enemies.splice(j,1)} break;
 }
 gems.forEach(g=>{let d=dist(p,g);if(d<100){g.x+=(p.x-g.x)*dt*3;g.y+=(p.y-g.y)*dt*3}});
 for(let i=gems.length-1;i>=0;i--)if(dist(p,gems[i])<p.r+gems[i].r){score+=gems[i].v*5;gems.splice(i,1)}
 p.hp=clamp(p.hp,0,p.maxhp);
 if(Math.floor(t/30)+1>wave && t>3)levelUp();
 if(t>=180)state='won';
 if(p.hp<=0)gameOver();
}
function draw(){
 x.clearRect(0,0,W,H);
 x.strokeStyle='#171e30';x.lineWidth=1;
 for(let i=0;i<W;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
 for(let i=0;i<H;i+=40){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}
 p.trail.forEach((q,i)=>{x.globalAlpha=(i/p.trail.length)*.3;x.fillStyle='#6ee7f9';x.beginPath();x.arc(q.x,q.y,3,0,7);x.fill()});x.globalAlpha=1;
 gems.forEach(g=>{x.fillStyle='#f6d365';x.beginPath();x.arc(g.x,g.y,g.r,0,7);x.fill()});
 bullets.forEach(b=>{x.fillStyle='#ffffff';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()});
 enemies.forEach(e=>{x.fillStyle=e.kind==='tank'?'#d85cff':e.kind==='hunter'?'#ff8a65':'#ff4f70';x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill()});
 x.fillStyle='#6ee7f9';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();
 x.fillStyle='#0b0f18';x.fillRect(18,18,190,10);x.fillStyle='#6ee7f9';x.fillRect(18,18,190*(p.hp/p.maxhp),10);
 x.fillStyle='#eaf1ff';x.font='14px system-ui';x.fillText(`Time ${Math.floor(t)}s  |  Kills ${kills}  |  Score ${Math.floor(score)}  |  Style ${style}`,18,52);
 let directorText = style==='mobile' ? 'DIRECTOR: You keep moving. Hunters are adapting.' :
                    style==='aggressive' ? 'DIRECTOR: You are fighting aggressively. Pressure is rising.' :
                    'DIRECTOR: Balanced play detected. The arena is staying controlled.';
 x.fillStyle='#8f9bb8'; x.font='12px system-ui'; x.fillText(directorText,18,72);
 if(state==='won')msg.innerHTML='<div class="panel"><div style="font-size:28px;font-weight:900">180 SECONDS</div><p>You survived.</p><p>Score: <b>'+Math.floor(score)+'</b> · Kills: <b>'+kills+'</b></p><p class="small">Director classification: <b>'+style+'</b></p><p style="margin-top:18px">Can you survive by deliberately changing your playstyle?</p><button onclick="location.reload()">PLAY ANOTHER RUN</button></div>';
}
function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
